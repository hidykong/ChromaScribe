        <style>
            .project-card {
                width: 290px;
                height: 295px;
                background: #FFFFFF;
                border: 1px solid #EDEDED;
                border-radius: 12px;
                overflow: hidden;
                display: flex;
                flex-direction: column;
                justify-content: flex-start;
                align-items: stretch;
                cursor: pointer;
                transition: transform 120ms ease, box-shadow 120ms ease, border-color 120ms ease;
                box-shadow: 0 4px 18px rgba(0, 48, 83, 0.10);
            }

            .project-card:hover {
                transform: translateY(-2px);
                box-shadow: 0 10px 28px rgba(0, 48, 83, 0.18);
                border-color: rgba(58, 97, 221, 0.35);
            }

            .create-project-card {
                width: 290px;
                height: 295px;
                background: #FFFFFF;
                border: 2px dashed rgba(58, 97, 221, 0.35);
                border-radius: 12px;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                gap: 16px;
                cursor: pointer;
                transition: transform 120ms ease, box-shadow 120ms ease, border-color 120ms ease, background 120ms ease;
            }

            .create-project-card:hover {
                transform: translateY(-2px);
                box-shadow: 0 10px 28px rgba(0, 48, 83, 0.14);
                border-color: rgba(58, 97, 221, 0.65);
                background: #F7F8FF;
            }

            .create-project-icon {
                width: 40px;
                height: 40px;
                border-radius: 999px;
                background: rgba(58, 97, 221, 0.10);
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .create-project-title {
                color: #111827;
                font-size: 21px;
                font-family: Nunito;
                font-weight: 800;
                line-height: 26px;
                text-align: center;
            }

            .create-project-subtitle {
                color: #6B7280;
                font-size: 13px;
                font-family: Inter, sans-serif;
                font-weight: 600;
                text-align: center;
            }

            .project-thumb { height: 160px; background: #F7F8FF; position: relative; }
            .project-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

            .project-status-badge {
                position: absolute;
                top: 12px;
                left: 12px;
                background: rgba(58, 97, 221, 0.10);
                color: #3A61DD;
                border: 1px solid rgba(58, 97, 221, 0.22);
                border-radius: 999px;
                padding: 4px 10px;
                font-family: Nunito;
                font-size: 12px;
                font-weight: 800;
                line-height: 16px;
            }

            .project-action-row {
                position: absolute;
                top: 12px;
                right: 12px;
                display: flex;
                align-items: center;
                gap: 8px;
            }

            .project-action-button {
                width: 34px;
                height: 34px;
                border: 0;
                border-radius: 999px;
                background: rgba(255, 255, 255, 0.96);
                box-shadow: 0 6px 16px rgba(0, 0, 0, 0.10);
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                transition: transform 120ms ease, background 120ms ease, box-shadow 120ms ease;
            }

            .project-action-button:hover {
                transform: translateY(-1px);
            }

            .project-rename-button:hover {
                background: #EFF3FF;
                box-shadow: 0 8px 18px rgba(58, 97, 221, 0.18);
            }

            .project-delete-button:hover {
                background: #fff1f1;
                box-shadow: 0 8px 18px rgba(180, 38, 38, 0.18);
            }

            .project-action-button img {
                width: 16px;
                height: 16px;
                object-fit: contain;
                opacity: 0.85;
            }

            .project-rename-button img {
                filter: var(--cs-action-icon-filter);
                opacity: 1;
            }

            .project-delete-button img {
                filter: brightness(0) saturate(100%) invert(25%) sepia(83%) saturate(1912%) hue-rotate(337deg) brightness(91%) contrast(91%);
                opacity: 1;
            }

            .project-body { padding: 14px 16px 16px 16px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
            .project-title { color: #111827; font-size: 18px; font-family: Nunito; font-weight: 800; line-height: 22px; word-wrap: break-word; }

            .project-stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
            .project-stat { flex: 1; background: #F7F8FF; border: 1px solid #EDEDED; border-radius: 10px; padding: 8px 10px; }
            .project-stat-label { color: #6B7280; font-size: 10px; font-family: Inter, sans-serif; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; line-height: 14px; }
            .project-stat-value { color: #111827; font-size: 16px; font-family: Inter, sans-serif; font-weight: 800; line-height: 18px; margin-top: 2px; }

            .project-footer { margin-top: auto; display: flex; align-items: center; justify-content: flex-end; color: #6B7280; font-size: 12px; font-family: Inter, sans-serif; font-weight: 600; }
            .project-open { color: #3A61DD; font-weight: 800; }

                --home-right-gutter: clamp(24px, 3vw, 64px);
                --project-card-width: 290px;
                --project-grid-gap: 48px;

            html,

                width: 100%;
                max-width: 100%;
                overflow-x: hidden;

                right: var(--home-right-gutter) !important;
                top: 115px !important;
                width: auto !important;

            #projects-grid {
                left: var(--home-left-gutter) !important;
                right: var(--home-right-gutter) !important;
                top: 220px !important;
                width: auto !important;
                max-width: none !important;

                grid-template-columns: repeat(auto-fill, minmax(var(--project-card-width), var(--project-card-width)));
                justify-content: start;
                align-items: start;
                gap: var(--project-grid-gap);
            }

            #projectCardsContainer {
                display: contents !important;

            #demoProject {
                width: var(--project-card-width);
            }

            @media (max-width: 860px) {
                #projects-divider {
                    top: 115px !important;
                }

                #projects-toolbar {
                    top: 150px !important;
                }

                #projects-grid {
                    top: 220px !important;
                }
            }

        <script>
            window.CURRENT_PROJECT_ID = '{{ session.get("current_project_id", "") }}';
            window.USER_WORKSPACE_KEY = '{{ session.get("user_workspace_key", "") }}';
            try {
                if (window.USER_WORKSPACE_KEY) localStorage.setItem("currentWorkspaceKey", window.USER_WORKSPACE_KEY);
                if (window.CURRENT_PROJECT_ID) localStorage.setItem("currentProjectId", window.CURRENT_PROJECT_ID);
            } catch (error) {
                console.warn("Could not sync project context:", error);
            }

            function selectUserProject(projectId, projectName) {
                const blankData = {};
                const workspaceKey = localStorage.getItem('currentWorkspaceKey') || window.USER_WORKSPACE_KEY || '';
                const scopedProjectId = workspaceKey ? `${workspaceKey}__${projectId}` : projectId;
                localStorage.setItem(`data.json_${scopedProjectId}`, JSON.stringify(blankData));
                localStorage.setItem('currentProjectId', projectId);
                const payload = { projectId };
                if (projectName) {
                    payload.projectName = projectName;
                }
                fetch('/api/projects/select', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                })
                .then(response => response.json())
                .then((data) => {
                    if (data?.projectContext && window.ChromaUsageLogger?.setContext) {
                        window.ChromaUsageLogger.setContext(data.projectContext);
                    }
                    if (data?.projectContext?.workspaceKey) {
                        localStorage.setItem('currentWorkspaceKey', data.projectContext.workspaceKey);
                    }
                    window.location.href = '/fileManager';
                });
            }

            async function createAndOpenNewProject() {
                try {
                    const response = await fetch('/api/prepare_new_project', { method: 'POST' });
                    if (!response.ok) {
                        throw new Error(`Failed to create project: ${response.status}`);
                    }
                    const data = await response.json();
                    const currentProjectId = data?.projectContext?.currentProjectId;
                    const workspaceKey = data?.projectContext?.workspaceKey;
                    if (workspaceKey) {
                        localStorage.setItem('currentWorkspaceKey', workspaceKey);
                    }
                    if (currentProjectId) {
                        const scopedProjectId = workspaceKey ? `${workspaceKey}__${currentProjectId}` : currentProjectId;
                        localStorage.setItem('currentProjectId', currentProjectId);
                        localStorage.removeItem(`FileMap_MatchedData_${scopedProjectId}`);
                        localStorage.removeItem(`FileMap_ForDemographics_${scopedProjectId}`);
                        localStorage.removeItem(`data.json_${scopedProjectId}`);
                        localStorage.setItem(`data.json_${scopedProjectId}`, JSON.stringify({}));
                    }
                    if (data?.projectContext && window.ChromaUsageLogger?.setContext) {
                        window.ChromaUsageLogger.setContext(data.projectContext);
                    }
                    if (!workspaceKey) {
                        localStorage.removeItem('FileMap_MatchedData');
                        localStorage.removeItem('FileMap_ForDemographics');
                        localStorage.setItem('data.json', JSON.stringify({}));
                    }
                    window.location.href = '/fileManager';
                } catch (error) {
                    console.warn("Failed to create a new project:", error);
                    alert("Could not create a new project right now. Please try again.");
                }
            }

            function syncDeletedProjectLocalState(projectId, projectContext) {
                const workspaceKey = projectContext?.workspaceKey || localStorage.getItem('currentWorkspaceKey') || window.USER_WORKSPACE_KEY || '';
                const scopedProjectId = workspaceKey ? `${workspaceKey}__${projectId}` : projectId;
                if (projectContext?.currentProjectId) {
                    localStorage.setItem('currentProjectId', projectContext.currentProjectId);
                } else if (localStorage.getItem('currentProjectId') === projectId) {
                    localStorage.removeItem('currentProjectId');
                }
                if (projectContext?.workspaceKey) {
                    localStorage.setItem('currentWorkspaceKey', projectContext.workspaceKey);
                }

                const explicitKeys = [
                    `themesObject_${projectId}`,
                    `themesObject_${scopedProjectId}`,
                    `demographicsObject_${projectId}`,
                    `demographicsObject_${scopedProjectId}`,
                    `FileMap_ForDemographics_${projectId}`,
                    `FileMap_ForDemographics_${scopedProjectId}`,
                    `FileMap_MatchedData_${projectId}`,
                    `FileMap_MatchedData_${scopedProjectId}`,
                    `data.json_${projectId}`,
                    `data.json_${scopedProjectId}`
                ];
                const discoveredKeys = [];

                for (let i = 0; i < localStorage.length; i += 1) {
                    const key = localStorage.key(i);
                    if (!key) continue;
                    const isProjectScoped = (
                        key.startsWith("non_verbal_")
                        || key.startsWith("themesObject_")
                        || key.startsWith("demographicsObject_")
                        || key.startsWith("FileMap_")
                    ) && (key.includes(`:${projectId}`) || key.includes(`_${projectId}`));
                    if (isProjectScoped) {
                        discoveredKeys.push(key);
                    }
                }

                [...explicitKeys, ...discoveredKeys].forEach((key) => {
                    try {
                        localStorage.removeItem(key);
                    } catch (error) {
                        console.warn("Failed to clear local project cache:", key, error);
                    }
                });
            }

            async function deleteUserProject(projectId, projectName) {
                const label = projectName || projectId;
                const confirmed = window.confirm(`Delete "${label}" and all of its local files, outputs, and saved project data?`);
                if (!confirmed) {
                    return;
                }

                try {
                    const response = await fetch('/api/projects/delete', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ projectId })
                    });
                    const data = await response.json();
                    if (!response.ok) {
                        throw new Error(data?.error || `Failed to delete project: ${response.status}`);
                    }

                    syncDeletedProjectLocalState(projectId, data?.projectContext);
                    await loadProjects();
                } catch (error) {
                    console.warn("Failed to delete project:", error);
                    alert("Could not delete this project right now. Please try again.");
                }
            }

            async function renameUserProject(projectId, currentName) {
                const nextName = window.prompt("Rename project", currentName || "");
                if (nextName === null) {
                    return;
                }

                const projectName = nextName.trim();
                if (!projectName) {
                    alert("Project name cannot be empty.");
                    return;
                }
                if (projectName === (currentName || "").trim()) {
                    return;
                }

                try {
                    const response = await fetch('/api/projects/rename', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ projectId, projectName })
                    });
                    const data = await response.json().catch(() => ({}));
                    if (!response.ok) {
                        throw new Error(data?.warning || data?.error || `Failed to rename project: ${response.status}`);
                    }
                    if (data?.projectContext && window.ChromaUsageLogger?.setContext) {
                        window.ChromaUsageLogger.setContext(data.projectContext);
                    }
                    await loadProjects({ preserveExistingOnError: true });
                } catch (error) {
                    console.warn("Failed to rename project:", error);
                    alert(error?.message || "Could not rename this project right now. Please try again.");
                }
            }

            function escapeHtml(value) {
                return String(value ?? "").replace(/[&<>"']/g, function (char) {
                    return {
                        "&": "&amp;",
                        "<": "&lt;",
                        ">": "&gt;",
                        '"': "&quot;",
                        "'": "&#39;"
                    }[char];
                });
            }

            function toCount(value) {
                const count = Number(value);
                return Number.isFinite(count) ? count : 0;
            }

            function hasProjectData(project) {
                return toCount(project.participantsCount) > 0
                    || toCount(project.transcriptsCount) > 0
                    || toCount(project.audioCount) > 0;
            }

            function getProjectDisplayName(project) {
                const storedName = (project.projectName || "").trim();
                if (storedName) {
                    return storedName;
                }
                return "Untitled Project";
            }

            function createProjectCard(project, index) {
                const projectId = project.projectId || `user_project_${index + 1}`;
                const transcripts = toCount(project.transcriptsCount);
                const audio = toCount(project.audioCount);
                const hasData = hasProjectData(project);
                const displayName = getProjectDisplayName(project);
                const storedName = (project.projectName || "").trim() || displayName;

                const card = document.createElement("div");
                card.classList.add("project-card");
                card.setAttribute("data-project-id", projectId);
                card.innerHTML = `
                    <div class="project-thumb">
                        <img src="/static/images/project-placeholder.png" alt="Project thumbnail" onerror="this.onerror=null;this.src='/static/images/thumbnail.png';">
                        <div class="project-status-badge">${hasData ? "Active" : "New"}</div>
                        <div class="project-action-row">
                            <button type="button" class="project-action-button project-rename-button" title="Rename project" aria-label="Rename project">
                                <img src="/static/images/edit.png" alt="">
                            </button>
                            <button type="button" class="project-action-button project-delete-button" title="Delete project" aria-label="Delete project">
                                <img src="/static/images/trash.png" alt="">
                            </button>
                        </div>
                    </div>
                    <div class="project-body">
                        <div class="project-title" title="${escapeHtml(displayName)}">${escapeHtml(displayName)}</div>
                        <div class="project-stats">
                            <div class="project-stat">
                                <div class="project-stat-label">Transcripts</div>
                                <div class="project-stat-value">${transcripts}</div>
                            </div>
                            <div class="project-stat">
                                <div class="project-stat-label">Audio</div>
                                <div class="project-stat-value">${audio}</div>
                            </div>
                        </div>
                        <div class="project-footer">
                            <span class="project-open">Open →</span>
                        </div>
                    </div>
                `;
                const renameButton = card.querySelector(".project-rename-button");
                if (renameButton) {
                    renameButton.addEventListener("click", function (event) {
                        event.preventDefault();
                        event.stopPropagation();
                        renameUserProject(projectId, displayName);
                    });
                }
                const deleteButton = card.querySelector(".project-delete-button");
                if (deleteButton) {
                    deleteButton.addEventListener("click", function (event) {
                        event.preventDefault();
                        event.stopPropagation();
                        deleteUserProject(projectId, storedName);
                    });
                }
                card.addEventListener("click", function () {
                    selectUserProject(projectId, storedName);
                });
                return card;
            }

            function createNewProjectCard() {
                const card = document.createElement("div");
                card.classList.add("create-project-card");
                card.innerHTML = `
                    <div class="create-project-icon">
                        <img src="/static/images/add.png" alt="Create new project" style="width: 18px; height: 18px;">
                    </div>
                    <div class="create-project-title">Create New Project</div>
                    <div class="create-project-subtitle">Start another workspace</div>
                `;
                card.addEventListener("click", createAndOpenNewProject);
                return card;
            }

            function renderProjectCards(projects) {
                const container = document.getElementById("projectCardsContainer");
                if (!container) return;

                container.innerHTML = "";
                const userProjects = (projects || []).filter(project => project && project.customName !== false);

                if (!userProjects.length) {
                    container.appendChild(createNewProjectCard());
                    return;
                }

                userProjects.forEach((project, index) => {
                    container.appendChild(createProjectCard(project, index));
                });
                container.appendChild(createNewProjectCard());
            }

            let projectLoadPromise = null;
            const PROJECTS_REFRESH_MS = 30000;

            async function loadProjects(options = {}) {
                const preserveExistingOnError = options.preserveExistingOnError === true;
                if (projectLoadPromise) {
                    return projectLoadPromise;
                }

                projectLoadPromise = (async function () {
                    try {
                        const response = await fetch('/api/projects/list', { cache: 'no-store' });
                        if (!response.ok) {
                            throw new Error(`Failed to load projects: ${response.status}`);
                        }
                        const data = await response.json();
                        if (data?.currentProjectId) {
                            localStorage.setItem('currentProjectId', data.currentProjectId);
                        }
                        if (data?.workspaceKey) {
                            localStorage.setItem('currentWorkspaceKey', data.workspaceKey);
                        }
                        renderProjectCards(data.projects || []);
                    } catch (error) {
                        console.warn("Failed to load projects:", error);
                        if (!preserveExistingOnError) {
                            renderProjectCards([]);
                        }
                    } finally {
                        projectLoadPromise = null;
                    }
                })();

                return projectLoadPromise;
            }

            function refreshProjectsOnReturn() {
                return loadProjects({ preserveExistingOnError: true });
            }

            async function handlePageVisibilityChange() {
                if (!document.hidden) {
                    await refreshProjectsOnReturn();
                }
            }

            async function handleWindowFocus() {
                await refreshProjectsOnReturn();
            }

            async function handlePageShow() {
                await refreshProjectsOnReturn();
            }

            async function refreshProjectsOnInterval() {
                if (document.hidden) {
                    return;
                }
                try {
                    await refreshProjectsOnReturn();
                } catch (error) {
                    console.warn("Background project refresh failed:", error);
                }
            }

            document.getElementById("demoProject").addEventListener("click", function () {
                fetch('/api/start_demo', { method: 'POST' })
                .then(response => {
                    // The backend will handle the redirect, but we can also force it here.
                    if (response.redirected) {
                        window.location.href = response.url;
                    }
                });
            });

            document.getElementById("resetDemoProject").addEventListener("click", async function (event) {
                event.preventDefault();
                event.stopPropagation();
                if (!window.confirm("Reset your demo project to its original data? Your demo edits will be removed.")) return;
                const response = await fetch('/api/reset_demo', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ demoProjectId: 'project1' })
                });
                const payload = await response.json().catch(() => ({}));
                if (!response.ok) {
                    window.alert(payload.error || "The demo project could not be reset.");
                    return;
                }
                window.alert("Your demo project was reset.");
            });

            loadProjects();
            window.addEventListener("focus", handleWindowFocus);
            window.addEventListener("pageshow", handlePageShow);
            document.addEventListener("visibilitychange", handlePageVisibilityChange);
            window.setInterval(refreshProjectsOnInterval, PROJECTS_REFRESH_MS);

        </script>
        
        
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    </body>
</html>
