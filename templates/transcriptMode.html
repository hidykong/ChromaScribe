        <script>
        document.addEventListener('DOMContentLoaded', async () => {
            let tabCount = 0;
            const tabs = {};
            const tabsContainer = document.getElementById('tabsContainer');
            const addTabBtn = document.getElementById('addTab');

            const currentParticipant = JSON.parse('{{ participant | tojson | safe }}');
            let projectId = window.CURRENT_PROJECT_ID || localStorage.getItem("currentProjectId");

            function projectStorageScope(value = projectId) {
                const resolvedProjectId = String(value || "").trim();
                if (!resolvedProjectId) return "";
                const workspaceKey = window.USER_WORKSPACE_KEY || localStorage.getItem("currentWorkspaceKey") || "";
                return workspaceKey ? `${workspaceKey}__${resolvedProjectId}` : resolvedProjectId;
            }

            function parseStoredFileMap(rawValue, storageKey) {
                if (!rawValue) return null;
                try {
                    const parsed = JSON.parse(rawValue);
                    return parsed && Array.isArray(parsed.participants) ? parsed : null;
                } catch (e) {
                    console.warn("Error parsing FileMap from localStorage:", storageKey, e);
                    try {
                        localStorage.removeItem(storageKey);
                    } catch (_) {}
                    return null;
                }
            }

            function normalizeParticipantEntry(entry) {
                const participant = typeof entry === 'string'
                    ? entry.trim()
                    : String(entry?.participant || '').trim();
                if (!participant) return null;
                return {
                    ...(typeof entry === 'object' && entry ? entry : {}),
                    participant
                };
            }

            function sortParticipants(participants) {
                return participants.sort((a, b) =>
                    a.participant.localeCompare(b.participant, undefined, { numeric: true })
                );
            }

            function uniqueParticipants(entries) {
                const participantMap = new Map();
                entries.forEach(entry => {
                    const normalized = normalizeParticipantEntry(entry);
                    if (!normalized) return;
                    participantMap.set(normalized.participant, {
                        ...(participantMap.get(normalized.participant) || {}),
                        ...normalized
                    });
                });
                return sortParticipants(Array.from(participantMap.values()));
            }

            function participantFromTranscriptRecord(record, fileKey) {
                const explicitParticipant = String(record?.participantId || record?.participant || '').trim();
                if (explicitParticipant) return explicitParticipant;
                const candidates = [
                    record?.audiofile,
                    fileKey
                ].filter(Boolean);
                for (const candidate of candidates) {
                    const basename = String(candidate).split(/[\\/]/).pop() || String(candidate);
                    let match = basename.match(/(^|[^A-Za-z0-9])P\s*0*(\d+)(?![A-Za-z0-9])/i);
                    if (match && match[2]) return `P${parseInt(match[2], 10)}`;
                    match = basename.match(/^P\s*0*(\d+)/i);
                    if (match && match[1]) return `P${parseInt(match[1], 10)}`;
                    match = basename.match(/(^|[^A-Za-z0-9])pt\s*0*(\d+)(?![A-Za-z0-9])/i);
                    if (match && match[2]) return `P${parseInt(match[2], 10)}`;
                    match = basename.match(/^0*(\d+)(?=[_\.\s-])/);
                    if (match && match[1]) return `P${parseInt(match[1], 10)}`;
                }
                return '';
            }

            async function loadProcessedTranscriptParticipants() {
                const processedTranscriptsUrl = String(window.PROCESSED_TRANSCRIPTS_URL || '').trim();
                if (!processedTranscriptsUrl) return [];
                try {
                    const separator = processedTranscriptsUrl.includes("?") ? "&" : "?";
                    const response = await fetch(`${processedTranscriptsUrl}${separator}t=${Date.now()}`, { cache: 'no-store' });
                    if (!response.ok) {
                        throw new Error(`Failed to load processed transcripts: ${response.status}`);
                    }
                    const data = await response.json();
                    if (!data || typeof data !== 'object' || Array.isArray(data)) return [];
                    return uniqueParticipants(Object.entries(data).map(([fileKey, record]) => ({
                        participant: participantFromTranscriptRecord(record, fileKey)
                    })));
                } catch (e) {
                    console.warn("Failed to load processed transcript participants for tabs:", e);
                    return [];
                }
            }

            async function loadParticipantsForTabs() {
                try {
                    const projectParam = projectId ? `?projectId=${encodeURIComponent(projectId)}` : "";
                    const response = await fetch(`/api/filemap/load${projectParam}`, { cache: 'no-store' });
                    if (!response.ok) {
                        throw new Error(`Failed to load file map: ${response.status}`);
                    }
                    const data = await response.json();
                    const resolvedProjectId = String(data?.projectContext?.currentProjectId || projectId || "").trim();
                    if (resolvedProjectId) {
                        projectId = resolvedProjectId;
                        localStorage.setItem("currentProjectId", resolvedProjectId);
                    }
                    const workspaceKey = String(data?.projectContext?.workspaceKey || window.USER_WORKSPACE_KEY || localStorage.getItem("currentWorkspaceKey") || "").trim();
                    if (workspaceKey) localStorage.setItem("currentWorkspaceKey", workspaceKey);
                    const fileMap = data && data.fileMap && Array.isArray(data.fileMap.participants)
                        ? data.fileMap
                        : null;
                    const storageScope = projectStorageScope(resolvedProjectId);
                    const matchedKey = storageScope ? `FileMap_MatchedData_${storageScope}` : 'FileMap_MatchedData';
                    const demographicsKey = storageScope ? `FileMap_ForDemographics_${storageScope}` : 'FileMap_ForDemographics';
                    const dataKey = storageScope ? `data.json_${storageScope}` : 'data.json';
                    if (fileMap) {
                        const serialized = JSON.stringify(fileMap);
                        const demographics = JSON.stringify(fileMap.participants
                            .map(entry => ({ participant: typeof entry === 'string' ? entry : entry.participant }))
                            .filter(entry => entry.participant));
                        const dataPayload = JSON.stringify({ participants: fileMap.participants });
                        localStorage.setItem(matchedKey, serialized);
                        localStorage.setItem(demographicsKey, demographics);
                        localStorage.setItem(dataKey, dataPayload);
                        return uniqueParticipants(fileMap.participants);
                    }
                    localStorage.removeItem(matchedKey);
                    localStorage.removeItem(demographicsKey);
                    localStorage.setItem(dataKey, JSON.stringify({}));
                    return [];
                } catch (e) {
                    console.warn("Failed to restore FileMap for transcript tabs:", e);
                }

                const storageScope = projectStorageScope(projectId);
                const matchedKey = storageScope ? `FileMap_MatchedData_${storageScope}` : 'FileMap_MatchedData';
                const scopedMap = parseStoredFileMap(localStorage.getItem(matchedKey), matchedKey);
                if (scopedMap) {
                    return uniqueParticipants(scopedMap.participants);
                }

                return [];
            }

            let allParticipants = uniqueParticipants([
                ...(await loadParticipantsForTabs()),
                ...(await loadProcessedTranscriptParticipants())
            ]);
            if (window.APP_MODE === 'demo' && allParticipants.length === 0) {
                console.log("TABS: Demo mode detected. Using fallback participant list.");
                allParticipants = [
                    { participant: 'P3' },
                    { participant: 'P6' },
                    { participant: 'P7' }
                ];
            }
            
            const openTabsKey = window.APP_MODE === 'demo'
                ? 'openTranscriptTabs_demo'
                : (projectId ? `openTranscriptTabs_${projectId}` : 'openTranscriptTabs');

            const tabParticipants = uniqueParticipants([
                ...allParticipants,
                { participant: currentParticipant }
            ]).map(entry => entry.participant);
            localStorage.setItem(openTabsKey, JSON.stringify(tabParticipants));

            function createTab(participant, isActive = false) {
                const tabId = `tab-${participant}`;
                if (tabs[tabId]) return;

                const tabBtn = document.createElement('button');
                tabBtn.className = 'tab-button';
                tabBtn.dataset.tabId = tabId;
                
                const tabText = document.createElement('span');
                tabText.textContent = participant;
                tabBtn.appendChild(tabText);

                tabBtn.addEventListener('click', () => activateTab(tabId));
                
                tabsContainer.insertBefore(tabBtn, addTabBtn);
                tabs[tabId] = { participant, button: tabBtn };

                if (isActive) {
                    tabBtn.classList.add('active');
                }
            }


            // --- Function to show the "Add Tab" dropdown menu ---
            function showAddTabMenu(event) {
                event.stopPropagation(); // Prevent clicks from closing it immediately
                    
                // Remove any existing menu
                d3.select("#add-tab-menu").remove();

                // Get a list of participants who are NOT already open in a tab
                const openParticipants = Object.values(tabs).map(t => t.participant);
                const availableParticipants = allParticipants.filter(p => !openParticipants.includes(p.participant));
                    
                if (availableParticipants.length === 0) {
                    // Optional: Show a message if all participants are already open
                    return;
                }

                // Create the menu
                const menu = d3.select("body").append("div")
                    .attr("id", "add-tab-menu")
                    .style("position", "absolute")
                    .style("left", `${addTabBtn.getBoundingClientRect().left}px`)
                    .style("top", `${addTabBtn.getBoundingClientRect().bottom + 5}px`)
                    .style("background-color", "white")
                    .style("border", "1px solid #ccc")
                    .style("box-shadow", "0 4px 8px rgba(0,0,0,0.1)")
                    .style("border-radius", "5px")
                    .style("z-index", "1001");

                    // Populate the menu with available participants
                availableParticipants.forEach(p_info => {
                    menu.append("div")
                        .attr("class", "add-tab-menu-item")
                        .text(p_info.participant)
                        .on("click", function() {
                            // When an item is clicked, create a new tab for that participant
                            createTab(p_info.participant);
                            // And immediately navigate to it
                            window.location.href = `/transcriptmodedetail?participant=${encodeURIComponent(p_info.participant)}`;
                        });
                });
            }

            d3.select("body").on("click.add-tab-menu", () => d3.select("#add-tab-menu").remove());
            addTabBtn.addEventListener('click', showAddTabMenu);

            // Create a tab for every uploaded transcript in the current project.
            tabParticipants.forEach(pId => {
                createTab(pId, pId === currentParticipant);
            });
           
            if (currentParticipant) {
                createTab(currentParticipant, true);
            }
            if (allParticipants.length > 0) {
                addTabBtn.style.display = 'none';
            }

            // This function handles navigation when a tab is clicked.
            function activateTab(tabId) {
                const tab = tabs[tabId];
                if (tab && tab.participant) {
                    // Navigate to the correct participant's editor page
                    window.location.href = `/transcriptmodedetail?participant=${encodeURIComponent(tab.participant)}`;
                }
            }

            // --- END OF UI BUILDING ---
        });
    </script>

    <script type="module">
        import { transcriptsObject } from "/static/chromascribe-main.js";

        const currentTranscriptParticipant = JSON.parse('{{ participant | tojson | safe }}');
        let transcriptSyncReloadTimer = null;

        function parseFileMap(rawValue) {
            if (!rawValue) return null;
            try {
                const parsed = JSON.parse(rawValue);
                return parsed && Array.isArray(parsed.participants) ? parsed : null;
            } catch (_) {
                return null;
            }
        }

        function getCurrentFileMap() {
            const projectId = window.CURRENT_PROJECT_ID || localStorage.getItem("currentProjectId");
            const workspaceKey = window.USER_WORKSPACE_KEY || localStorage.getItem("currentWorkspaceKey") || "";
            const storageScope = projectId && workspaceKey ? `${workspaceKey}__${projectId}` : projectId;
            const scopedKey = storageScope ? `FileMap_MatchedData_${storageScope}` : "FileMap_MatchedData";
            return parseFileMap(localStorage.getItem(scopedKey));
        }

        function scheduleTranscriptSyncReload() {
            if (transcriptSyncReloadTimer) return;
            transcriptSyncReloadTimer = window.setTimeout(() => {
                const fileMap = getCurrentFileMap();
                const participants = Array.isArray(fileMap?.participants) ? fileMap.participants : [];
                const hasCurrentParticipant = participants.some((entry) => {
                    const participant = typeof entry === "string" ? entry : entry?.participant;
                    return String(participant || "").trim() === String(currentTranscriptParticipant || "").trim();
                });
                const hasProcessedParticipant = Object.prototype.hasOwnProperty.call(
                    transcriptsObject.transcripts || {},
                    String(currentTranscriptParticipant || "").trim()
                );
                if (hasCurrentParticipant || hasProcessedParticipant) {
                    window.location.reload();
                } else {
                    window.location.href = "/transcriptmode";
                }
            }, 250);
        }

        window.addEventListener("storage", (event) => {
            if (!event || !event.key) return;
            if (
                !event.key.includes("FileMap_MatchedData") &&
                !event.key.startsWith("data.json") &&
                !event.key.includes("themesObject")
            ) return;
            scheduleTranscriptSyncReload();
        });

        window.addEventListener("themes:generation-started", scheduleTranscriptSyncReload);
        window.addEventListener("themes:code-suggestions-updated", scheduleTranscriptSyncReload);
    </script>


    <script>
            // Function to apply text formatting (bold, italic, underline, etc.)
            function formatText(command) {
                let selection = window.getSelection();
                if (selection.rangeCount > 0) {
                    document.execCommand(command, false, null);
                } else {
                    alert('Please select some text to format.');
                }
            }

            function changeFontSize(action) {
            // Get the current selection
            let selection = window.getSelection();
            
            if (selection.rangeCount > 0) {
                // Get the selected range
                let selectedRange = selection.getRangeAt(0);

                // Ensure you're working with an element, not a text node
                let selectedElement = selectedRange.commonAncestorContainer.nodeType === 1 ? 
                                    selectedRange.commonAncestorContainer : 
                                    selectedRange.commonAncestorContainer.parentElement;

                // Check if the selected element is a span or already styled
                if (selectedElement.nodeName !== "SPAN") {
                    // If not wrapped in a span, wrap the selection in a span
                    let span = document.createElement('span');
                    span.appendChild(selectedRange.extractContents());
                    selectedRange.insertNode(span);
                    selectedElement = span;
                }

                // Get the current font size of the selected element
                let currentFontSize = window.getComputedStyle(selectedElement, null).getPropertyValue('font-size');
                let newSize = parseInt(currentFontSize);
                
                // Adjust the font size
                if (action === 'increase') {
                    newSize += 2;
                } else if (action === 'decrease') {
                    newSize -= 2;
                }
                
                // Apply the new font size to the selected element
                selectedElement.style.fontSize = newSize + 'px';

                // Update the font size display
                document.getElementById('fontSizeDisplay').textContent = newSize + 'px';
            } else {
                alert('Please select some text to change the font size.');
            }
            }
        </script>
