<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        <script src="https://d3js.org/d3.v4.min.js"></script> 
        <link rel="stylesheet" href="../static/styles.css?v=20260522a">

        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;400;600&display=swap" rel="stylesheet">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <body class="container-fluid" style="padding-left: 0; padding-right: 0; margin-left: 0; background: #E5E5E5; 
    font-family: Nunito; font-size: 16px;">
    <div id="main-page" style="display: none; height: 100%;">
    <div id="vis-holder" style="display: flex; height: 100%; width: 100%; overflow: hidden;">
        <div id="menu" style="display: flex; flex-direction: column; height: 100%; min-width: 55px; background: #ffffff; overflow: auto;">
            <button id="settings-button" class="settings">
                <img id="settings-icon" class="interactive-icon" src="../static/images/settings-icon.png" style="height: 100%; width: 90%;"></img>
            </button>
            <button id="menu-button" class="menu" style="height: 40px; border-radius: 0; background: #ffffff;">
                <img id="menu-icon" class="interactive-icon" src="../static/images/filter-icon.png" style="height: 100%; width: 100%;"></img>
            </button>
        </div>
    <div id="visual" class="container-fluid" style="width: 100%; height: 100%; padding-left: 0;
        padding-right: 0; margin-left: 0; margin-right: 0;">
        <div id="patient_results">
            <div class="flex-container container" style="display: flex; width: 100%; height: 100%; 
            flex-direction: column; flex-wrap: wrap; padding-left: 0; padding-right: 0; margin-left: 0; 
            margin-top: 22px; margin-bottom: 22px;"> 
            </div>
        </div>
    </div>
</div>
</div>
    <div id="settings-page" style="display: flex; height: 100%; width: 100%; overflow: hidden;">
        <div id="editing" class="sections" style="position: absolute; z-index: 2; left: 0px; right: 0px; 
        top: 0px; bottom: 0px; display: flex; flex-direction: row;">
            <div id="settingsTabs" style="background: #ffffff; box-shadow: 0px 4px 4px 4px rgba(0, 48, 83, 0.25); 
            height: 100%; width: 16%; overflow: auto;"></div>
            <div id="main-edit-window" style="height: 100%; width: 84%; display: flex; flex-direction: column; 
            align-items: center; overflow: auto;"></div>
        </div>
    </div>
    
        <script type="module" src="/static/Pages/projectProgressSync.js?v=20260823a" defer></script>
        <script src="https://unpkg.com/@popperjs/core@2/dist/umd/popper.min.js"></script>
<script src="https://unpkg.com/tippy.js@6/dist/tippy-bundle.umd.js"></script>
        <script type="module">
            import { showSettings } from '../static/Pages/settings-page/menupanel.js?v=20260901a';
            import { nameProject } from "../static/Pages/settings-page/import/nameProject.js?v=20260601d";
            window.APP_MODE = '{{ mode }}';
            window.CURRENT_PROJECT_ID = '{{ session.get("current_project_id", "") }}';
            window.USER_WORKSPACE_KEY = '{{ session.get("user_workspace_key", "") }}';
            try {
                if (window.USER_WORKSPACE_KEY) localStorage.setItem("currentWorkspaceKey", window.USER_WORKSPACE_KEY);
                if (window.CURRENT_PROJECT_ID) localStorage.setItem("currentProjectId", window.CURRENT_PROJECT_ID);
            } catch (error) {
                console.warn("Could not sync project context:", error);
            }
            //var username = "{{ username }}";
            showSettings();
            d3.select("#import-tab").select("div").style("background", "#3A61DD1F").select("img")
            .attr("src", "/static/images/Enable_Filesmanager.png");
            nameProject().catch((error) => {
                console.error("Could not render File Manager:", error);
                const mainEditWindow = d3.select("#main-edit-window");
                mainEditWindow.selectAll("*").remove();
                mainEditWindow.append("div")
                    .style("font-family", "Inter")
                    .style("font-size", "18px")
                    .style("font-weight", "700")
                    .style("color", "#111827")
                    .style("margin", "48px")
                    .text("Could not load File Manager. Please refresh the page.");
            });
            var mainEditWindow = d3.select("#main-edit-window");
            //const blankData = {};
            //localStorage.setItem('data.json', JSON.stringify(blankData));
            
        </script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    </body>
</html>
