    <title>Theme Editing</title>
    <style>
        
        #main-edit-window {
            display: flex;
            flex-direction: column;
            position: absolute; /* Use absolute positioning */
    right: 10; /* Align the div to the right of the screen */
    top: 0; /* Adjust as needed */
    height: 100vh; /* Optional: makes it full height */
        }
        #main-edit-window .text {
            position: absolute;
            top: 35%;
            width: 350px;
            font-size: 34px;
            font-weight: 700;
        }
        #main-edit-window .text button {
            margin-top: 30px;
            background: #e2e1e1;
            border-radius: 10px;
            width: 180px;
            height: 45px;
            padding: 12px 20px;
            font-weight: 700;
            font-size: 16px;
        }
        #main-edit-window .text .demo-button {
            background: #3a61dd;
            color: #ffffff;
            width: 250px;
        }

        .tabs {
    display: flex;
    gap: 20px;
}

.tab {
    font-size: 16px;
    cursor: pointer;
}

.tab:hover {
    color: #007bff;
}
.new-file {
    font-size: 16px;
    
    padding: 5px 10px;
    border-radius: 5px;
    cursor: pointer;
}

.new-file:hover {
    color: #007bff;
}
        .transcript-start-content {
            min-height: 100%;
            padding: 32px 48px 56px;
            box-sizing: border-box;
        }

        .search {
            width: min(1080px, 86%);
            margin: 12px auto 0;
            display: flex;
            justify-content: center;
        }

        #searchInput {
            width: 100%;
            height: 48px;
            padding: 0 16px;
            border: 1px solid #cfd4dc;
            border-radius: 7px;
            background: #ffffff;
            font-family: Inter, sans-serif;
            font-size: 16px;
            color: #111827;
            outline: none;
        }

        #searchInput:focus {
            border-color: #3a61dd;
            box-shadow: 0 0 0 3px rgba(58, 97, 221, 0.12);
        }

        /* Documents list styles */
        .documents-list {
            width: min(1380px, 86%);
            margin: 72px auto 0;
        }

        .document {
            display: flex;
            align-items: center;
            background-color: white;
            min-height: 70px;
            padding: 0 22px;
            border: 1px solid #edf0f4;
            border-radius: 8px;
            margin-bottom: 10px;
            box-shadow: 0 2px 6px rgba(15, 23, 42, 0.08);
            cursor: pointer;
            transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
        }

        .document:hover {
            border-color: #c7d2fe;
            box-shadow: 0 8px 18px rgba(15, 23, 42, 0.11);
            transform: translateY(-1px);
        }

        .document .document-info {
            display: grid;
            grid-template-columns: minmax(160px, 1fr) auto 64px;
            align-items: center;
            gap: 18px;
            width: 100%;
        }

        .document-name {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            color: #111827;
            font-family: Inter, sans-serif;
            font-weight: 700;
        }

        .asset-icons {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            flex: 0 0 auto;
        }

        .asset-icon {
            width: 28px;
            height: 28px;
            border-radius: 7px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        .asset-icon img {
            width: 17px;
            height: 17px;
            object-fit: contain;
        }

        .asset-icon.transcript {
            background: #111827;
        }

        .asset-icon.audio {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(180deg, #4d73f0 0%, #3A61DD 100%);
            border: 1px solid rgba(255, 255, 255, 0.72);
            box-shadow: 0 5px 14px rgba(58, 97, 221, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.28);
            position: relative;
        }

        .asset-icon.audio img {
            display: none;
        }

        .asset-icon.audio::before {
            content: "";
            width: 0;
            height: 0;
            border-top: 7px solid transparent;
            border-bottom: 7px solid transparent;
            border-left: 11px solid #ffffff;
            margin-left: 3px;
        }

        .document .codes {
            background-color: #28a745;
            color: white;
            min-width: 92px;
            padding: 7px 16px;
            border-radius: 999px;
            font-family: Inter, sans-serif;
            font-weight: 800;
            text-align: center;
        }

        .document .timestamp {
            color: #6b7280;
            font-family: Inter, sans-serif;
            font-size: 13px;
            font-weight: 700;
            text-align: right;
        }

        @media (max-width: 900px) {
            .transcript-start-content {
                padding: 24px 18px 40px;
            }

            .search,
            .documents-list {
                width: 100%;
            }

            .documents-list {
                margin-top: 34px;
            }

            .document .document-info {
                grid-template-columns: 1fr auto;
            }

            .document .timestamp {
                display: none;
            }
        }
    </style>
</head>

    <script type="module">
        import { showSettings } from '../static/Pages/settings-page/menupanel.js?v=20260901a';
        import{renderDocuments, filterDocuments} from '../static/Pages/settings-page/transcriptMode/startTranscriptMode.js?v=20260823a';
        window.APP_MODE = '{{ mode }}';
        window.CURRENT_PROJECT_ID = '{{ session.get("current_project_id", "") }}';
        window.USER_WORKSPACE_KEY = '{{ session.get("user_workspace_key", "") }}';
        try {
            if (window.USER_WORKSPACE_KEY) localStorage.setItem("currentWorkspaceKey", window.USER_WORKSPACE_KEY);
            if (window.CURRENT_PROJECT_ID) localStorage.setItem("currentProjectId", window.CURRENT_PROJECT_ID);
        } catch (error) {
            console.warn("Could not sync project context:", error);
        }
        window.PROCESSED_TRANSCRIPTS_URL = '{{ processed_transcripts_url or "" }}';

        renderDocuments();
        document.getElementById('searchInput').addEventListener('input', filterDocuments);

        showSettings();
        d3.select("#transcript-tab").select("div").style("background", "#3A61DD1F").select("img")
            .attr("src", "/static/images/Enable_editor.png");

            async function fetchThemes() {

            const themeObject = await response.json();
            console.log("182",themeObject)
        }

        // Call fetchThemes on page load
        fetchThemes();
