name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check publication files
        run: python scripts/check_public_tree.py
      - name: Install application dependencies
        run: python -m pip install -r requirements.lock
      - name: Check dependency consistency
        run: python -m pip check
      - name: Check Python syntax
        run: python -m compileall -q app.py config.py routes services processing_scripts scripts
      - name: Check JavaScript syntax
        run: find static -name '*.js' -print0 | xargs -0 -n 1 node --check
